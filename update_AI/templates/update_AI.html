{% extends "base.html" %}
{% load static %}
{% url 'AI_text_list' as your_AI_list_url %}

{% block content %}
<div class="container">
    <div class="row">
        <!-- col-12 class from bootstrap -->
        <div class="standard col-12">
        {% if new %}
        <h1>Add training to your AI</h1>
        {% else %}
        <h1>Update training for your AI</h1>
        {% endif %}
        <br>
        <form id="train_form" method="POST">
            {% csrf_token %}
            <label for="train_AI" class="label_div">AI Training Text</label>
            <textarea id="train_AI" name="train_AI" rows="10" cols="30" aria-label="New training text to be add to the list of training texts">{{ text }}</textarea>
            <br>
            <br>
            <!-- btn-success classes from bootstrap used for train AI button  -->
            <button type="submit" id="train_AI_button" class="btn btn-success" aria-label="Button that saves a new training text with the typed in text">Train AI</button>
            <br>
        </form>
        <br>
        <a href="{% url 'AI_text_list' AI_id %}" class="btn btn-success" aria-label="Button that sends you to the AI list">Go to AI training text List</a>
        </div>
    </div>
</div>
<!-- custom javascript -->
<script src="/static/js/script.js"></script>
{% endblock %}
